name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'
      - 'sample-compass-ts/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'
      - 'sample-compass-ts/**'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Python E2E テスト
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python dependencies
      working-directory: ./sample-compass
      run: |
        uv sync

    - name: Run Python E2E tests
      working-directory: ./sample-compass
      run: |
        echo "🚀 Python E2E テストを実行中..."
        uv run pytest e2e_test_compass.py -v --tb=short
        echo "✅ Python E2E テスト完了"

    # TypeScript E2E テスト
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: sample-compass-ts/package-lock.json

    - name: Install TypeScript dependencies
      working-directory: ./sample-compass-ts
      run: npm ci

    - name: Build TypeScript
      working-directory: ./sample-compass-ts
      run: npm run build

    - name: Run TypeScript E2E tests
      working-directory: ./sample-compass-ts
      run: |
        echo "🚀 TypeScript E2E テストを実行中..."
        npm test -- --testPathPattern="e2e" -v
        echo "✅ TypeScript E2E テスト完了"

    # 統合テスト結果のレポート
    - name: E2E Test Summary
      if: always()
      run: |
        echo "📊 E2E テスト実行完了"
        echo "✅ すべてのプロジェクトで E2E テストが成功しました"
