name: Integration and Simulator Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'projects/sample-compass/**'
      - 'projects/sample-compass-makecode/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'projects/sample-compass/**'
      - 'projects/sample-compass-makecode/**'

jobs:
  makecode-integration:
    runs-on: ubuntu-latest
    name: MakeCode Integration Tests

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.23.2'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Run MakeCode tests
      working-directory: ./projects/sample-compass-makecode
      run: |
        npm ci
        echo "🚀 MakeCode シミュレーターテストを実行中..."
        npm test
        echo "✅ MakeCode テスト完了"

  python-integration:
    runs-on: ubuntu-latest
    name: Python Playwright Integration Tests

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Run Python Playwright tests
      working-directory: ./projects/sample-compass
      run: |
        echo "🚀 Python Playwright テストを実行中..."
        uv sync
        uv run playwright install
        uv run python -m pytest test/test_simulator.py -v
        echo "✅ Python テスト完了"

    - name: Integration test summary
      if: always()
      run: |
        echo "📊 統合・シミュレーターテスト実行完了"
        echo "ジョブ結果: ${{ job.status }}"
