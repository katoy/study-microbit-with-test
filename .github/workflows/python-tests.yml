name: Python Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Install dependencies
      working-directory: ./sample-compass
      run: |
        uv sync

    - name: Run all tests with coverage
      working-directory: ./sample-compass
      run: |
        uv run pytest test_compass.py test_build_hex.py test_compass_integration.py -v --cov=compass --cov-report=xml --cov-report=term-missing

    - name: Verify coverage meets 100% threshold
      working-directory: ./sample-compass
      run: |
        uv run pytest test_compass.py test_build_hex.py test_compass_integration.py --cov=compass --cov-fail-under=100

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        files: ./sample-compass/coverage.xml
        flags: python
        name: python-coverage
