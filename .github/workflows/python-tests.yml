name: Python Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sample-compass/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./sample-compass
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Run all tests with coverage
      working-directory: ./sample-compass
      run: |
        pytest test_compass.py e2e_test_compass.py -v --cov=compass --cov-report=xml --cov-report=term-missing

    - name: Verify coverage meets 100% threshold
      working-directory: ./sample-compass
      run: |
        pytest test_compass.py e2e_test_compass.py --cov=compass --cov-fail-under=100

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./sample-compass/coverage.xml
        flags: python
        name: python-coverage
