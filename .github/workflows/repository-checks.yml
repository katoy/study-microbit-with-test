name: Repository Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate all shell scripts
        run: |
          echo "🔍 Shell スクリプトをバリデーション中..."
          find .devcontainer scripts -name "*.sh" -type f | while read script; do
            echo "  ✓ $script"
            bash -n "$script" || exit 1
          done
          echo "✅ Shell スクリプト検証完了"

      - name: Validate package.json files
        run: |
          echo "🔍 package.json をバリデーション中..."
          node -e "
            const fs = require('fs');
            const files = ['package.json', 'projects/sample-compass-ts/package.json', 'projects/sample-compass-makecode/package.json'];
            files.forEach(f => {
              try {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                console.log('  ✓', f);
              } catch (e) {
                console.error('  ✗', f, e.message);
                process.exit(1);
              }
            });
          "
          echo "✅ package.json 検証完了"

      - name: Run repository configuration tests
        run: |
          echo "🔍 リポジトリ設定テストを実行中..."
          npm run test:config
          echo "✅ リポジトリ設定テスト完了"
