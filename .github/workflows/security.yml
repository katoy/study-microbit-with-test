name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  repository-scan:
    runs-on: ubuntu-latest
    name: Repository Scan
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner
        # Note: Known vulnerabilities in pxt-microbit/pxt-core build dependencies
        # are whitelisted in .trivyignore. These are build-time only and do not
        # ship to the micro:bit device.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif

  python-static-analysis:
    runs-on: ubuntu-latest
    name: Python Static Analysis
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run Bandit security check
        run: |
          echo "🔍 Python セキュリティチェックを実行中..."
          uvx bandit@1.9.4 \
            projects/sample-compass/src/compass_makecode.py \
            -f txt -v
          echo "✅ Python セキュリティチェック完了"
