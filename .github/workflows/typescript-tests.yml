name: TypeScript Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sample-compass-ts/**'
      - '.github/workflows/typescript-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sample-compass-ts/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: sample-compass-ts/package-lock.json

    - name: Install dependencies
      working-directory: ./sample-compass-ts
      run: npm ci

    - name: Build TypeScript
      working-directory: ./sample-compass-ts
      run: npm run build

    - name: Run tests with coverage
      working-directory: ./sample-compass-ts
      run: npm run test:coverage

    - name: Verify coverage meets 100% threshold
      working-directory: ./sample-compass-ts
      run: |
        npm test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}'

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./sample-compass-ts/coverage/coverage-final.json
        flags: typescript
        name: typescript-coverage

