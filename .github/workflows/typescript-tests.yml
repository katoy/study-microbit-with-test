name: TypeScript Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sample-compass-ts/**'
      - '.github/workflows/typescript-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sample-compass-ts/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.23.2'
        cache: 'npm'
        cache-dependency-path: sample-compass-ts/package-lock.json

    - name: Install dependencies
      working-directory: ./sample-compass-ts
      run: npm ci

    - name: Build TypeScript
      working-directory: ./sample-compass-ts
      run: npm run build

    - name: Run tests with coverage
      working-directory: ./sample-compass-ts
      run: npm run test:coverage

    - name: Verify coverage meets 100% threshold
      working-directory: ./sample-compass-ts
      run: |
        npm test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}'

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        files: ./sample-compass-ts/coverage/coverage-final.json
        flags: typescript
        name: typescript-coverage
