name: TypeScript Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'projects/sample-compass-ts/**'
      - '.github/workflows/typescript-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'projects/sample-compass-ts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    name: TypeScript Unit & Integration Tests

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.23.2'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Install TypeScript dependencies
      working-directory: ./projects/sample-compass-ts
      run: npm ci

    - name: Build TypeScript
      working-directory: ./projects/sample-compass-ts
      run: npm run build

    - name: Run unit tests
      working-directory: ./projects/sample-compass-ts
      run: |
        echo "🧪 TypeScript ユニットテストを実行中..."
        npm run test:unit
        echo "✅ ユニットテスト完了"

    - name: Run integration tests
      working-directory: ./projects/sample-compass-ts
      run: |
        echo "🔗 TypeScript 統合テストを実行中..."
        npm run test:integration -- --verbose
        echo "✅ 統合テスト完了"

    - name: Generate coverage report
      working-directory: ./projects/sample-compass-ts
      run: |
        echo "📊 カバレッジレポートを生成中..."
        npm run test:coverage
        echo "✅ カバレッジレポート完了"

    - name: Verify coverage meets 100% threshold
      working-directory: ./projects/sample-compass-ts
      run: |
        npm test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}'

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        files: ./projects/sample-compass-ts/coverage/coverage-final.json
        flags: typescript
        name: typescript-coverage
