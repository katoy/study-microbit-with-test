name: E2E テスト

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v3
    
    - name: Node.js をセットアップ
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Chrome をインストール
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
    
    - name: pxt をインストール
      run: |
        npm install -g pxt
    
    - name: プロジェクトディレクトリに移動
      working-directory: ./sample-compass-makecode
      run: |
        pxt install
    
    - name: npm 依存関係をインストール
      working-directory: ./sample-compass-makecode
      run: |
        npm install
    
    - name: 基本的な E2E テストを実行
      working-directory: ./sample-compass-makecode
      timeout-minutes: 5
      run: |
        npm run e2e
    
    - name: 詳細な E2E テストを実行
      working-directory: ./sample-compass-makecode
      timeout-minutes: 5
      run: |
        npm run e2e:advanced
    
    - name: スクリーンショットをアーティファクトにアップロード
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-screenshots
        path: ./sample-compass-makecode/e2e-screenshot-*.png
        retention-days: 7
    
    - name: テストログを保存
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-logs
        path: ./sample-compass-makecode/e2e-test.log
        retention-days: 7
