[project]
name = "sample-compass"
version = "1.0.0"
description = "micro:bit compass application for learning"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "uflash==2.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["compass"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
addopts = "-v"

[tool.coverage.run]
source = ["src/compass_makecode.py"]
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # line-length is checked separately

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
