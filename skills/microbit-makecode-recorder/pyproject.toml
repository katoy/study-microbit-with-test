[project]
name = "microbit-makecode-recorder"
version = "0.1.0"
description = "Record micro:bit program execution on MakeCode as GIF animations"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
